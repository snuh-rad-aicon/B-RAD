model:
  backbone:
    name: vit_base_patch16_224
    pretrained: true
    input_size: 224
    patch_size: 16
    use_intermediate: true
    unfreeze_blocks: 12
  detector:
    base_num_classes: 2
    predict_shadow_box: true
    predict_margin_box: true
    margin_box_ratio: 0.5
    dropout: 0.0
  anchors:
    stride: 16
    scales: [0.5, 2.5, 4.5, 6.5, 8.5, 10.5]
    aspect_ratios: [0.5, 1.0, 1.5, 2.0, 3.0]
  normalization:
    mean: [0.48145466, 0.4578275, 0.40821073]
    std: [0.26862954, 0.26130258, 0.27577711]
