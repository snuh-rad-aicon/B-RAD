# Shared environment for B-RAD-CLIP, B-RAD-Det, B-RAD-FULL, and the demo notebook.
# B-RAD-Seg needs its own environment (OpenMMLab) - see B-RAD/B-RAD-Seg/README.md.
name: b-rad
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch>=2.1
      - torchvision>=0.16
      - transformers>=4.41,<4.48
      - timm>=0.9
      - pyyaml
      - scikit-learn
      - opencv-python
      - numpy
      - pandas
      - pillow
      - tqdm
      - matplotlib
      - jupyter
      - ipykernel
